services:
  auth-service:
    build: .
    image: chapchap-auth-service:local
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_PORT: "8081"
      TZ: Asia/Seoul
      DB_HOST: ${COMPOSE_DB_HOST:-host.docker.internal}
      KAFKA_BOOTSTRAP_SERVERS: ${COMPOSE_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      FILE_ENDPOINT_URI: ${COMPOSE_FILE_ENDPOINT_URI:-http://host.docker.internal:9000}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  backend:
    external: true
    name: ${CHAPCHAP_NETWORK:-chapchap-network}
