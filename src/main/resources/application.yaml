server:
  port: ${APP_PORT}

spring:
  application:
    name: auth-service
    version: v1
  web:
    error:
      include-stacktrace: always
      include-message: always

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    defer-datasource-initialization: true
  sql:
    init:
      data-locations: classpath*:dummy/*.sql
      mode: always
      platform: all

  # Security & OAuth2
  security:
    oauth2:
      client:
        registration:
          kakao:
            # 카카오 개발자 센터에서 발급받은 REST API
            client-id: ${KAKAO_CLIENT_ID}
            # 추가적인 보안 인증키(카카오 내 설정에서 활성화 하지 않은 경우는 생략 가능)
            client-secret: ${KAKAO_CLIENT_SECRET}
            # 카카오 로그인을 마친 후 카카오 인증 서버가 인가코드를 전달받을 콜백 주소
            redirect-uri: "${GATEWAY_URI}/api/auth/oauth2/callback/{registrationId}"
            # OAuth2의 가장 대표적인 인증 방식
            authorization-grant-type: authorization_code
            # client-id와 secret을 전송할 때, Http Post Body 데이터를 전송
            client-authentication-method: client_secret_post
            # 카카오로부터 전달 받고자 하는 사용자 정보 설정
            scope:
              - profile_nickname
              - profile_image
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${GATEWAY_URI}/api/auth/oauth2/callback/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
        provider:
          kakao:
            # 사용자에게 카카오 로그인 창을 띄워주는 인증 요청 URL
            authorization-uri: "https://kauth.kakao.com/oauth/authorize"
            # 로그인 성공 후 전달받은 인가코드로 Access Token을 발급 받는 URL
            token-uri: "https://kauth.kakao.com/oauth/token"
            # 발급받은 Access Token을 이용해서 실제 사용자 프로필 정보를 가져오는 URL
            user-info-uri: "https://kapi.kakao.com/v2/user/me"
            # 카카오 응답에서 사용자 식별을 위한 필드명
            user-name-attribute: id

  kafka:
    # Spring Kafka 접속·직렬화 설정은 반드시 spring.kafka 아래에 둔다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # 서비스 간 계약은 JSON Envelope만 사용하고 Java 패키지 type header는 전송하지 않는다.
        spring.json.add.type.headers: false
    consumer:
      # Consumer는 Java 객체를 신뢰 역직렬화하지 않고 JSON 문자열을 직접 검증한다.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record


# Springdoc Openapi
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs
  open-api:
    servers:
      - url: ${GATEWAY_URI}
        description: ${APP_DESCRIPTION}

# Log
logging:
  file:
    name: logs/error.log
  level:
    root: info
    com.chapchapauthservice: debug


# Security & JWT
jwt:
  secure: false
  issuer: chapchap@chapchap.kr
  type: JWT

  # Access Token 만료 시간(밀리초)
  user-access-token-expiry: 1800000
  admin-access-token-expiry: 900000

  refresh-token-cookie-name: refresh-token

  # Refresh Token 쿠키 유지 시간(초)
  user-refresh-token-cookie-expiry: 1209600
  admin-refresh-token-cookie-expiry: 1800

  secret: ${JWT_SECRET}
  header-key: Authorization
  scheme: Bearer
  refresh-token-cookie-path: /api/auth
  refresh-token-cookie-same-site: Lax

# minio
minio:
  minio-endpoint: ${FILE_ENDPOINT_URI}
  minio-bucket: ${FILE_BUCKET}
  minio-access-key: ${FILE_ACCESS_KEY}
  minio-secret-key: ${FILE_SECRET_KEY}
  minio-profile-path: ${FILE_PROFILE_PATH}
  allow-image-extensions: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/webp"
  ]

# Sub Service
sub-service:
  frontend-callback-uri: ${FRONTEND_CALLBACK_URI}

app:
  security:
    allowed-origins:
      - ${GATEWAY_URI}

  # Kafka
  kafka:
    topics:
      auth-user-events: auth.user-events.v1
      auth-user-events-dlt: auth.user-events.v1.DLT
      subscription-address-events: subscription.address-events.v1
      subscription-address-events-dlt: subscription.address-events.v1.DLT
      subscription-status-events: subscription.subscription-events.v1
      subscription-status-events-dlt: subscription.subscription-events.v1.DLT
    consumer-groups:
      address: auth-service-address-group
      subscription: auth-service-subscription-group
    retry:
      interval-ms: 1000
      max-attempts: 3

# Internal service authentication is disabled until keys and allowlisted clients are injected.
internal-service-jwt:
  enabled: ${INTERNAL_SERVICE_JWT_ENABLED:false}
  issuer: ${INTERNAL_SERVICE_JWT_ISSUER:chapchap-auth-service}
  key-id: ${INTERNAL_SERVICE_JWT_KEY_ID:auth-1}
  token-ttl-seconds: ${INTERNAL_SERVICE_JWT_TOKEN_TTL_SECONDS:300}
  private-key-pem: ${INTERNAL_SERVICE_JWT_PRIVATE_KEY_PEM:}
  public-key-pem: ${INTERNAL_SERVICE_JWT_PUBLIC_KEY_PEM:}
  clients:
    customer-service:
      secret: ${AUTH_CUSTOMER_SERVICE_CLIENT_SECRET:}
      subject: customer-service
      allowed-audiences:
        - chapchap-customer-ai
      allowed-scopes:
        - customer-ai.invoke
    customer-ai:
      secret: ${AUTH_CUSTOMER_AI_CLIENT_SECRET:}
      subject: customer-ai
      allowed-audiences:
        - chapchap-customer-service
      allowed-scopes:
        - customer-ai.callback
